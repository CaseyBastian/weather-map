<div class="dashboard-container">
	<header class="topbar">
		<div class="brand-mark" aria-hidden="true"><span></span></div>
		<div class="brand-copy">
			<strong>Atmos</strong>
			<span>Weather intelligence</span>
		</div>
		<button
			*ngIf="refreshStatus$ | async as refreshStatus"
			class="live-status"
			type="button"
			[class.is-refreshing]="refreshStatus.state === 'refreshing'"
			[class.is-degraded]="refreshStatus.state === 'degraded'"
			(click)="refreshData()"
			[attr.aria-label]="refreshStatus.state === 'refreshing' ? 'Weather data is updating' : 'Refresh weather data now'"
			title="Auto-refresh is on. Select to refresh now."
		>
			<span class="status-dot" aria-hidden="true"></span>
			<span>
				{{ refreshStatus.state === 'refreshing' ? 'Updating live data' : refreshStatus.state === 'degraded' ? 'Some data delayed' : refreshLabel(refreshStatus.lastUpdated) }}
			</span>
			<mat-icon aria-hidden="true">refresh</mat-icon>
		</button>
	</header>
	<app-sidebar></app-sidebar>
	<app-weather-map></app-weather-map>
	<app-info-panel></app-info-panel>
	<div class="map-hint">
		<mat-icon aria-hidden="true">touch_app</mat-icon>
		Select a region for details
	</div>
</div>
