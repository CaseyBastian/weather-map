<div class="weather-card">
	<img [src]="forecastPeriod.icon" [alt]="forecastPeriod.shortForecast" />
	<div class="period-copy">
		<strong>{{ forecastPeriod.name }}</strong>
		<span>{{ forecastPeriod.shortForecast }}</span>
	</div>
	<div class="period-temp">{{ forecastPeriod.temperature }}°<span>{{ forecastPeriod.temperatureUnit }}</span></div>
</div>
